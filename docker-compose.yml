# Local development: `docker compose up` starts the database, backend and frontend.
#   Frontend  http://localhost:5173
#   Backend   http://localhost:8000  (API docs at /docs)
# Code folders are mounted into the containers, so edits reload without rebuilding.

services:
  db:
    image: postgres:17
    container_name: sitesense-db
    environment:
      POSTGRES_USER: sitesense
      POSTGRES_PASSWORD: sitesense
      POSTGRES_DB: sitesense
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sitesense"]
      interval: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: sitesense-backend
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    environment:
      DATABASE_URL: postgresql+psycopg://sitesense:sitesense@db:5432/sitesense
      CORS_ORIGINS: '["http://localhost:5173"]'
      # File change events do not reach containers from a Windows folder, so poll for changes
      WATCHFILES_FORCE_POLLING: "true"
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: sitesense-frontend
    environment:
      API_PROXY_TARGET: http://backend:8000
      WATCH_POLLING: "true"
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      # Keep the container's own node_modules (Linux builds), not the host's Windows ones
      - /app/node_modules
    depends_on:
      - backend

volumes:
  pgdata:
