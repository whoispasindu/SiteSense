name: CLA

# Asks each new contributor to sign the Contributor Licence Agreement (CLA.md) by commenting on
# their pull request, and records signatures on the cla-signatures branch. It never checks out or
# runs the pull request's code, which is what makes pull_request_target safe here.
on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write # the signatures file on the cla-signatures branch
  pull-requests: write
  statuses: write

jobs:
  cla:
    name: Contributor Licence Agreement
    if: >-
      github.event_name == 'pull_request_target' ||
      (github.event.issue.pull_request &&
        (github.event.comment.body == 'recheck' ||
         github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          path-to-signatures: signatures/cla.json
          path-to-document: https://github.com/${{ github.repository }}/blob/main/CLA.md
          branch: cla-signatures
          allowlist: whoispasindu,dependabot[bot],github-actions[bot]
