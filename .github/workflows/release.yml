name: Release

# A version tag (v1.0.0) publishes everything a company needs to run SiteSense (ADR 0019):
# - the backend and web app images on GitHub Container Registry, for amd64 and arm64 servers,
#   with an SBOM and build provenance attached, and signed with Sigstore (keyless);
# - a GitHub Release with the deployment bundle: the production compose file pinned to this
#   version, the Caddy and database files it mounts, the settings example and the setup script.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+", "v[0-9]+.[0-9]+.[0-9]+-*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    name: Tag matches the code's version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Versions agree
        id: version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          backend=$(sed -n 's/^    version: str = "\(.*\)"$/\1/p' backend/app/core/config.py)
          frontend=$(node -p "require('./frontend/package.json').version")
          echo "tag=$tag backend=$backend frontend=$frontend"
          if [ "$tag" != "$backend" ] || [ "$tag" != "$frontend" ]; then
            echo "::error::Tag v$tag does not match the backend ($backend) and web app ($frontend) versions."
            exit 1
          fi
          echo "version=$tag" >> "$GITHUB_OUTPUT"

  images:
    name: Image · ${{ matrix.image }}
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write # push to ghcr.io
      id-token: write # keyless signing (Sigstore)
    strategy:
      fail-fast: true
      matrix:
        image: [backend, frontend]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Model files, checked against their SHA-256 (backend image only)
        if: matrix.image == 'backend'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/fetch_models.py --via gh
          test -s backend/app/ai/nlp/models/report-issues-category/tokenizer.json
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/sitesense-${{ matrix.image }}
          # 1.2.3, 1.2 and latest; a pre-release (1.2.3-rc.1) gets only its own tag.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          flavor: |
            latest=auto
          labels: |
            org.opencontainers.image.title=SiteSense ${{ matrix.image }}
            org.opencontainers.image.licenses=AGPL-3.0-only
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./${{ matrix.image }}
          target: prod
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
          provenance: mode=max
      # Keyless signing records the signer (this repository and workflow) in Sigstore's public
      # transparency log, so it runs only once the repository is public.
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        if: ${{ !github.event.repository.private }}
      - name: Sign the image (keyless, tied to this workflow)
        if: ${{ !github.event.repository.private }}
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/sitesense-${{ matrix.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

  release:
    name: GitHub Release with the deployment bundle
    needs: [check, images]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # create the release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the bundle
        env:
          VERSION: ${{ needs.check.outputs.version }}
          OWNER: ${{ github.repository_owner }}
        run: python3 scripts/make_bundle.py --version "$VERSION" --owner "$OWNER" --out dist
      - name: Release notes from the changelog
        env:
          VERSION: ${{ needs.check.outputs.version }}
          PRIVATE: ${{ github.event.repository.private }}
        run: |
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" { on = 1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then echo "See CHANGELOG.md." > notes.md; fi
          {
            echo
            echo "### Images"
            echo
            echo "- \`ghcr.io/${GITHUB_REPOSITORY_OWNER}/sitesense-backend:${VERSION}\`"
            echo "- \`ghcr.io/${GITHUB_REPOSITORY_OWNER}/sitesense-frontend:${VERSION}\`"
            echo
            if [ "$PRIVATE" = "true" ]; then
              echo "Not signed: images are signed once the repository is public (ADR 0019)."
            else
              echo "Signed with Sigstore by this repository's release workflow. To check one, with cosign 3.0 or later:"
              echo
              echo '```bash'
              echo "cosign verify ghcr.io/${GITHUB_REPOSITORY_OWNER}/sitesense-backend:${VERSION} \\"
              echo "  --certificate-identity-regexp '^https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@' \\"
              echo "  --certificate-oidc-issuer https://token.actions.githubusercontent.com"
              echo '```'
            fi
            echo
            echo "Install or upgrade: download the bundle below and follow docs/self-hosting.md."
          } >> notes.md
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          prerelease=""
          case "$VERSION" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" --verify-tag $prerelease \
            --title "SiteSense $VERSION" --notes-file notes.md \
            dist/sitesense-"$VERSION".tar.gz dist/sitesense-"$VERSION".tar.gz.sha256
